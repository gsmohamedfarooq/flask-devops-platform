name: Flask CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  python-test-cicd:
    runs-on: self-hosted

    steps:
      - name: Show runner information
        run: |
          echo "Hostname:"
          hostname

          echo "Operating system:"
          cat /etc/os-release

          echo "Kernel:"
          uname -r


      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Setup Python environment
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest -v



      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Flask application
        run: |
          python -m py_compile app.py

      - name: Run tests
        run: |
          pytest
      - name: Package application
        run: |
          zip -r flask-app.zip app.py requirements.txt test_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-app
          path: flask-app.zip

      - name: Display success message
        run: echo "Flask CI completed successfully"
